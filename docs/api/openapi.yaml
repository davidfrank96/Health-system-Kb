  /api/v1/status/history:
    get:
      operationId: getSampledHistory
      summary: getSampledHistory
      description: Implemented locally. Daily summary, <=90 days, always labeled 15-minute sampled availability.
        start/end are UTC with [start,end) slots, max90 days. One service vote per slot across historically
        required endpoints (failure, then unknown, then success). Daily counts are summed. Fractions are0–1;
        missing samples never success. Latest100 overlapping outages returned; eventsTruncated signals
        a narrower range is needed.
      x-implementation-status: implemented-local
      x-required-roles:
      - viewer
