            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429': &id006
          description: Rate limited; Retry-After supplied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds before retry
        '503': &id007
          description: Temporarily unavailable
          content:
            application/problem+json:
