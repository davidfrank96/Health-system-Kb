components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-kbean_session
    QASignature:
      type: apiKey
      in: header
      name: X-Kbean-Signature
      description: v1=HMAC-SHA256 hex over timestamp.eventId.rawBody. Requires key ID, timestamp and event ID. See
        QA design.
  parameters:
    Environment:
      name: environment
      in: query
      required: true
      schema: &id014
        type: string
        enum:
        - production
        - staging
        - development
      description: Must be authorized by session membership; no implicit cross-environment default.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
      description: Opaque cursor bound to filter, scope and stable time/id ordering.
    Id:
      name: id
      in: path
      required: true
      schema: *id001
    Start:
      name: start
      in: query
      required: true
      schema: &id010
        type: string
        format: date-time
    End:
      name: end
      in: query
      required: true
      schema: *id010
    AssetId:
      name: assetId
      in: query
      required: true
      schema: *id001
    MetricName:
      name: metric
      in: query
      required: true
      schema:
        type: string
        maxLength: 150
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 80
      description: Quoted current revision ETag. Stale revisions return 409.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 16
      description: Actor+route scoped, retained 24h. Same payload returns original response; conflict returns 409.
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        maxLength: 256
      description: Session-bound token plus server Origin validation for browser mutations.
