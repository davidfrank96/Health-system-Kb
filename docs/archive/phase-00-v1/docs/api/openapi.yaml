                format: uuid
              description: Trace identifier without sensitive details
        '400': &id002
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': &id003
          description: Authentication failed
          content:
            application/problem+json:
              schema:
